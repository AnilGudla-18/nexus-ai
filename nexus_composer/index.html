
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            background: transparent;
            font-family: Arial, sans-serif;
        }

        .composer {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border: 1px solid #555;
            border-radius: 18px;
            background: #202020;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            color: white;
            background: transparent;
            border: none;
            outline: none;
            font-size: 15px;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 50%;
            padding: 10px;
            color: white;
            background: #333;
            font-size: 18px;
        }

        button.send {
            background: #1685e8;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="composer">
        <input id="question" placeholder="Ask NEXUS AI anything..." />
        <button id="mic" title="Speak">🎙️</button>
        <button id="send" class="send" title="Send">➤</button>
    </div>

    <script>
        const Streamlit = window.parent.Streamlit;
        const input = document.getElementById("question");
        const mic = document.getElementById("mic");
        const send = document.getElementById("send");

        function sendQuestion() {
            const value = input.value.trim();
            if (!value) return;

            Streamlit.setComponentValue({
                type: "text",
                text: value
            });
            input.value = "";
        }

        send.addEventListener("click", sendQuestion);

        input.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                event.preventDefault();
                sendQuestion();
            }
        });

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = event => {
                const transcript =
                    event.results[0][0].transcript;

                input.value = transcript;
                sendQuestion();
            };

            recognition.onerror = () => {
                mic.textContent = "🎙️";
            };

            recognition.onend = () => {
                mic.textContent = "🎙️";
            };

            mic.addEventListener("click", () => {
                try {
                    recognition.lang = "en-IN";
                    mic.textContent = "🔴";
                    recognition.start();
                } catch (error) {
                    mic.textContent = "🎙️";
                }
            });
        } else {
            mic.disabled = true;
            mic.title = "Speech recognition is not supported";
        }

        Streamlit.setFrameHeight(65);
        Streamlit.setComponentReady();
    </script>
</body>
</html>
